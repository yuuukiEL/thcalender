<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <!-- CSRFトークンのメタタグを追加 -->
    <meta name="csrf-token" content="{{ csrf_token }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='common/css/main.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='common/css/sidebar.css') }}" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    {% include 'student/components/sidebar.html' %}
    
    <div class="main-content">
        {% include 'student/components/header.html' %}
        
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='common/js/main.js') }}"></script>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- CSRFトークンを取得するためのJavaScript -->
    <script>
        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
