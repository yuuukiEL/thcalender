{% extends "student/components/base.html" %}

{% block title %}連絡先情報編集{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6">連絡先情報編集</h1>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('student_api.update_contact_info') }}">
            <div class="mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="phone" class="block text-gray-700 mb-2">電話番号</label>
                        <input type="tel" id="phone" name="phone" value="{{ contact.phone or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label for="postal_code" class="block text-gray-700 mb-2">郵便番号</label>
                        <input type="text" id="postal_code" name="postal_code" value="{{ contact.postal_code or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                    <div class="col-span-2">
                        <label for="address" class="block text-gray-700 mb-2">住所</label>
                        <input type="text" id="address" name="address" value="{{ contact.address or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                </div>
            </div>
            
            <div class="mb-6">
                <h2 class="text-xl font-semibold mb-4">緊急連絡先</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="emergency_contact_name" class="block text-gray-700 mb-2">氏名</label>
                        <input type="text" id="emergency_contact_name" name="emergency_contact_name" 
                               value="{{ contact.emergency_contact_name or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label for="emergency_contact_phone" class="block text-gray-700 mb-2">電話番号</label>
                        <input type="tel" id="emergency_contact_phone" name="emergency_contact_phone" 
                               value="{{ contact.emergency_contact_phone or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                    <div>
                        <label for="emergency_contact_relationship" class="block text-gray-700 mb-2">続柄</label>
                        <input type="text" id="emergency_contact_relationship" name="emergency_contact_relationship" 
                               value="{{ contact.emergency_contact_relationship or '' }}" 
                               class="w-full px-3 py-2 border rounded-md">
                    </div>
                </div>
            </div>
            
            <div class="flex justify-between">
                <a href="{{ url_for('student_api.profile') }}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 px-4 rounded">
                    キャンセル
                </a>
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">
                    保存する
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
