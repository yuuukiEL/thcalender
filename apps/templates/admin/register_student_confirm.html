<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学生情報登録確認</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .confirm-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .value {
            margin-left: 20px;
            color: #333;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            margin: 10px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .confirm-button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-button {
            background-color: #0066cc;
            color: white;
        }
        .back-button {
            background-color: #666;
            color: white;
        }
        .submit-button:hover {
            background-color: #0052a3;
        }
        .back-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>登録内容の確認</h1>

    <form method="post" action="{{ url_for('register_student_complete') }}" enctype="multipart/form-data">
        <div class="confirm-group">
            <div class="label">学籍番号:</div>
            <div class="value">{{ student_data.student_base_number }}</div>
            <input type="hidden" name="student_base_number" value="{{ student_data.student_base_number }}">
        </div>

        <div class="confirm-group">
            <div class="label">氏名:</div>
            <div class="value">{{ student_data.name }}</div>
            <input type="hidden" name="name" value="{{ student_data.name }}">
        </div>

        {% if student_data.image_data %}
        <div class="confirm-group">
            <div class="label">プロフィール画像:</div>
            <img src="data:image/jpeg;base64,{{ student_data.image_data }}" class="preview-image">
            <input type="hidden" name="image_data" value="{{ student_data.image_data }}">
            <input type="hidden" name="image_filename" value="{{ student_data.image_filename }}">
        </div>
        {% endif %}

        <input type="hidden" name="password" value="{{ student_data.password }}">

        <div class="note">
            ※学科情報は登録後の学生情報更新画面で設定できます。
        </div>

        <div class="button-group">
            <button type="button" onclick="history.back()" class="confirm-button back-button">修正する</button>
            <button type="submit" class="confirm-button submit-button">登録する</button>
        </div>
    </form>
</body>
</html>
