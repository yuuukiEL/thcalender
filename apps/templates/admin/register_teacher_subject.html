<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>教員教科登録</title>
</head>
<body>
    <h1>教員教科登録</h1>
    <form method="post">
        <label for="teacher_id">教員:</label>
        <select id="teacher_id" name="teacher_id" required>
            {% for teacher_id, name in teachers %}
            <option value="{{ teacher_id }}">{{ name }}</option>
            {% endfor %}
        </select>
        <br>
        <label for="subject_id">教科:</label>
        <select id="subject_id" name="subject_id" required>
            {% for subject_id, subject_name in subjects %}
            <option value="{{ subject_id }}">{{ subject_name }}</option>
            {% endfor %}
        </select>
        <br>
        <button type="submit">登録</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</body>
</html>
