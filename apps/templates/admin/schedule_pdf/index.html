{% extends "base.html" %}

{% block title %}時間割表示{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/schedule.css') }}">
<!-- Bootstrap CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>

<!-- PDF生成用のライブラリを追加 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div class="container-fluid">
    <div class="row">
        <!-- 左側：操作パネル -->
        <div class="col-md-3">
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0">時間割表示設定</h5>
                </div>
                <div class="card-body">
                    <!-- クラス選択 -->
                    <div class="form-group mb-3">
                        <label for="class-select">クラス:</label>
                        <select id="class-select" class="form-control">
                            <option value="">クラスを選択してください</option>
                        </select>
                    </div>

                    <!-- 表示形式選択 -->
                    <div id="viewSelector" class="form-group mb-3" style="display: none;">
                        <label>表示形式:</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-primary" id="gridViewBtn">
                                <i class="fas fa-th"></i> グリッド
                            </button>
                            <button type="button" class="btn btn-outline-primary" id="listViewBtn">
                                <i class="fas fa-list"></i> リスト
                            </button>
                        </div>
                    </div>

                    <!-- 期間選択（グリッド表示時のみ） -->
                    <div id="dateRangeSelector" class="date-range-container" style="display: none;">
                        <div class="mb-3">
                            <label class="form-label">開始日</label>
                            <input type="date" id="start-date" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">終了日</label>
                            <input type="date" id="end-date" class="form-control">
                        </div>
                        <button id="show-schedule" class="show-schedule-btn">
                            <i class="fas fa-calendar-check"></i> 時間割を表示
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：時間割表示エリア -->
        <div class="col-md-9">
            <div id="scheduleContainer" style="display: none;">
                <!-- グリッド表示 -->
                <div id="gridView" class="schedule-view" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">時間割表</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="timetable">
                                    <thead>
                                        <tr>
                                            <th class="period-header">時限</th>
                                            <th>月曜</th>
                                            <th>火曜</th>
                                            <th>水曜</th>
                                            <th>木曜</th>
                                            <th>金曜</th>
                                            <th>土曜</th>
                                        </tr>
                                    </thead>
                                    <tbody id="schedule-body">
                                        <!-- 時限ごとの行を動的に生成 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- リスト表示 -->
                <div id="listView" class="schedule-view" style="display: none;">
                    <div id="schedule-list">
                        <!-- 時間割リストが動的に生成される -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 座席配置と生徒一覧の統合モーダル -->
<div class="modal fade" id="scheduleDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">授業詳細</h5>
                <div class="ms-3">
                    <span class="badge bg-primary" id="selectedScheduleInfo"></span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">座席表作成方法：</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="seating-method" id="new-seating" value="new" checked>
                        <label class="btn btn-outline-primary" for="new-seating">新規作成</label>

                        <input type="radio" class="btn-check" name="seating-method" id="pdf-reference" value="pdf">
                        <label class="btn btn-outline-primary" for="pdf-reference">PDF参照</label>
                    </div>
                </div>

                <div id="pdf-upload-section" style="display: none;">
                    <div class="mb-3">
                        <label for="pdf-file" class="form-label">PDFファイル選択：</label>
                        <input type="file" class="form-control" id="pdf-file" accept="application/pdf">
                    </div>
                </div>

                <div id="seating-chart-section">
                    <!-- 既存の座席表エリア -->
                    <div class="seating-chart">
                        <object id="seatMap" data="/static/frame1.svg" type="image/svg+xml"></object>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/schedule_pdf.js') }}"></script>
{% endblock %}
